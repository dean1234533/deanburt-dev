<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Generating logo...</title>
</head>
<body style="background:#09090b; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; font-family:system-ui; color:#fff; flex-direction:column; gap:16px;">
<canvas id="c" width="500" height="500" style="display:none;"></canvas>
<p id="msg" style="font-size:18px;">Generating logo PNG...</p>
<script>
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // Background
  ctx.fillStyle = '#09090b';
  ctx.fillRect(0, 0, 500, 500);

  // Rounded rect helper
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  // Glow
  ctx.shadowColor = 'rgba(59,130,246,0.5)';
  ctx.shadowBlur = 60;

  // Gradient rounded square
  const grad = ctx.createLinearGradient(90, 90, 410, 410);
  grad.addColorStop(0, '#3b82f6');
  grad.addColorStop(1, '#06b6d4');
  ctx.fillStyle = grad;
  roundRect(90, 90, 320, 320, 70);
  ctx.fill();

  // Reset shadow
  ctx.shadowBlur = 0;

  // Letter D
  ctx.fillStyle = '#ffffff';
  ctx.font = '900 200px system-ui, -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('D', 250, 258);

  // Download
  canvas.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dean-burt-gmb-logo.png';
    a.click();
    document.getElementById('msg').textContent = '✓ Logo downloaded — upload it to Google My Business as your logo.';
  }, 'image/png');
</script>
</body>
</html>
