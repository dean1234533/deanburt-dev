<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1332px; height: 750px; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');

  .cover {
    width: 1332px;
    height: 750px;
    background: #09090b;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Background glow blobs */
  .blob1 {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, transparent 70%);
    top: -100px;
    left: -100px;
  }
  .blob2 {
    position: absolute;
    width: 500px;
    height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(6,182,212,0.14) 0%, transparent 70%);
    bottom: -80px;
    right: -80px;
  }
  .blob3 {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(139,92,246,0.1) 0%, transparent 70%);
    top: 50%;
    left: 55%;
    transform: translate(-50%, -50%);
  }

  /* Subtle grid pattern */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
  }

  .content {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }

  /* Logo mark */
  .logo {
    width: 80px;
    height: 80px;
    border-radius: 22px;
    background: linear-gradient(135deg, #3b82f6, #06b6d4);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -1px;
    box-shadow: 0 0 40px rgba(59,130,246,0.4);
  }

  .name {
    font-size: 64px;
    font-weight: 900;
    color: #ffffff;
    letter-spacing: -2px;
    line-height: 1;
  }

  .tagline {
    font-size: 22px;
    font-weight: 500;
    color: rgba(255,255,255,0.55);
    letter-spacing: 0.5px;
  }

  /* Pill badges */
  .badges {
    display: flex;
    gap: 12px;
    margin-top: 4px;
  }

  .badge {
    padding: 8px 20px;
    border-radius: 100px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }

  .badge-blue {
    background: rgba(59,130,246,0.15);
    border: 1px solid rgba(59,130,246,0.3);
    color: #60a5fa;
  }
  .badge-cyan {
    background: rgba(6,182,212,0.12);
    border: 1px solid rgba(6,182,212,0.25);
    color: #22d3ee;
  }
  .badge-purple {
    background: rgba(139,92,246,0.12);
    border: 1px solid rgba(139,92,246,0.25);
    color: #a78bfa;
  }

  .domain {
    font-size: 15px;
    color: rgba(255,255,255,0.25);
    letter-spacing: 1px;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="cover">
  <div class="blob1"></div>
  <div class="blob2"></div>
  <div class="blob3"></div>
  <div class="grid-overlay"></div>

  <div class="content">
    <div class="logo">D</div>
    <div>
      <div class="name">Dean Burt</div>
    </div>
    <div class="tagline">Full-Stack Developer · Apps &amp; Websites Built in the UK</div>
    <div class="badges">
      <span class="badge badge-blue">Web Apps</span>
      <span class="badge badge-cyan">Mobile Apps</span>
      <span class="badge badge-purple">E-Commerce</span>
    </div>
    <div class="domain">dean-da-dev.co.uk</div>
  </div>
</div>
</body>
</html>
